<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--pink:#ff2d75;
--dark-pink:#cc0050;
--purple:#6c3ce0;
--dark-purple:#1a0a3e;
--black:#0a0a0a;
--card:#141428;
--glass:rgba(20,20,40,.85);
--glow:rgba(255,45,117,.3);
}
html{scroll-behavior:smooth}
body{
font-family:'Poppins',sans-serif;
background:var(--black);
color:#fff;
overflow-x:hidden;
min-height:100vh;
-webkit-tap-highlight-color:transparent;
}

/* ===== SPLASH ===== */
.splash{
position:fixed;inset:0;z-index:9999;
background:var(--black);
display:flex;flex-direction:column;align-items:center;justify-content:center;
transition:opacity .6s,visibility .6s;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-emoji{font-size:5rem;animation:bounce 1s ease infinite}
.splash-text{
font-size:1.5rem;font-weight:700;
background:linear-gradient(135deg,var(--pink),var(--purple));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
margin-top:1rem;
}
.splash-sub{color:rgba(255,255,255,.4);font-size:.8rem;margin-top:.5rem}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.1)}}

/* ===== BG EFFECTS ===== */
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{
position:absolute;border-radius:50%;filter:blur(80px);opacity:.15;
animation:blobFloat 8s ease-in-out infinite;
}
.blob:nth-child(1){width:300px;height:300px;background:var(--pink);top:-10%;left:-10%;animation-delay:0s}
.blob:nth-child(2){width:250px;height:250px;background:var(--purple);bottom:-10%;right:-10%;animation-delay:2s}
.blob:nth-child(3){width:200px;height:200px;background:#ff6b9d;top:50%;left:50%;animation-delay:4s}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-30px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}}

/* ===== NAV ===== */
.nav{
position:fixed;top:0;left:0;right:0;z-index:100;
padding:.8rem 1.2rem;
background:rgba(10,10,10,.8);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,45,117,.1);
display:flex;align-items:center;justify-content:space-between;
}
.nav-brand{display:flex;align-items:center;gap:.5rem}
.nav-brand span{font-size:1.3rem}
.nav-brand h1{
font-size:1.1rem;font-weight:700;
background:linear-gradient(135deg,var(--pink),var(--purple));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.nav-status{
font-size:.7rem;color:var(--pink);
display:flex;align-items:center;gap:4px;
}
.nav-status .dot{
width:6px;height:6px;border-radius:50%;background:var(--pink);
animation:pulse 1.5s ease infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== MAIN LAYOUT ===== */
.app{
position:relative;z-index:2;
max-width:500px;margin:0 auto;
min-height:100vh;
padding-top:60px;
display:flex;flex-direction:column;
}

/* ===== HEADER ===== */
.chat-header{
padding:1.2rem;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.05);
}
.avatar-ring{
width:90px;height:90px;
margin:0 auto;
border-radius:50%;
padding:3px;
background:linear-gradient(135deg,var(--pink),var(--purple),var(--pink));
background-size:200% 200%;
animation:borderSpin 3s linear infinite;
position:relative;
}
@keyframes borderSpin{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.avatar-inner{
width:100%;height:100%;
border-radius:50%;
background:var(--card);
display:flex;align-items:center;justify-content:center;
font-size:3rem;
}
.chat-header h2{
font-size:1.2rem;font-weight:700;margin-top:.8rem;
background:linear-gradient(135deg,var(--pink),#ff6b9d);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.chat-header p{font-size:.75rem;color:rgba(255,255,255,.4);margin-top:.2rem}

/* ===== MOOD SELECTOR ===== */
.mood-bar{
display:flex;gap:.5rem;
padding:.8rem 1.2rem;
overflow-x:auto;
-webkit-overflow-scrolling:touch;
border-bottom:1px solid rgba(255,255,255,.05);
}
.mood-bar::-webkit-scrollbar{display:none}
.mood-btn{
flex-shrink:0;
background:rgba(255,45,117,.08);
border:1px solid rgba(255,45,117,.15);
border-radius:20px;
padding:.4rem 1rem;
color:var(--pink);
font-size:.75rem;
font-family:inherit;
cursor:pointer;
transition:all .3s;
display:flex;align-items:center;gap:4px;
white-space:nowrap;
}
.mood-btn:active,.mood-btn.active{
background:rgba(255,45,117,.2);
border-color:var(--pink);
transform:scale(.95);
}

/* ===== CHAT AREA ===== */
.chat-area{
flex:1;
overflow-y:auto;
padding:1rem 1.2rem;
display:flex;
flex-direction:column;
gap:.8rem;
}
.chat-area::-webkit-scrollbar{width:3px}
.chat-area::-webkit-scrollbar-thumb{background:var(--pink);border-radius:3px}

.msg{
max-width:80%;
padding:.8rem 1.1rem;
border-radius:20px;
font-size:.88rem;
line-height:1.6;
animation:msgIn .3s ease;
word-wrap:break-word;
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.bot{
background:linear-gradient(135deg,rgba(255,45,117,.1),rgba(108,60,224,.08));
border:1px solid rgba(255,45,117,.12);
align-self:flex-start;
border-bottom-left-radius:4px;
}
.msg.user{
background:linear-gradient(135deg,var(--pink),var(--purple));
align-self:flex-end;
border-bottom-right-radius:4px;
font-weight:500;
}
.msg .sender{
font-size:.65rem;font-weight:700;
color:var(--pink);
margin-bottom:.3rem;
letter-spacing:.5px;
}
.msg .typing-dots{display:flex;gap:4px;padding:4px 0}
.msg .typing-dots span{
width:6px;height:6px;border-radius:50%;
background:var(--pink);
animation:dotBounce .8s ease-in-out infinite;
}
.msg .typing-dots span:nth-child(2){animation-delay:.15s}
.msg .typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes dotBounce{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}

/* ===== EMOJI REACTIONS ===== */
.msg .reactions{
display:flex;gap:4px;margin-top:.4rem;
}
.msg .reactions span{
font-size:.8rem;padding:2px 6px;
border-radius:10px;
background:rgba(255,255,255,.05);
cursor:pointer;
transition:transform .2s;
}
.msg .reactions span:active{transform:scale(1.3)}

/* ===== QUICK REPLIES ===== */
.quick-bar{
display:flex;gap:.5rem;
padding:.6rem 1.2rem;
overflow-x:auto;
-webkit-overflow-scrolling:touch;
border-top:1px solid rgba(255,255,255,.05);
}
.quick-bar::-webkit-scrollbar{display:none}
.qbtn{
flex-shrink:0;
background:rgba(255,45,117,.06);
border:1px solid rgba(255,45,117,.12);
border-radius:18px;
padding:.45rem .9rem;
color:rgba(255,255,255,.7);
font-size:.75rem;
font-family:inherit;
cursor:pointer;
transition:all .3s;
white-space:nowrap;
}
.qbtn:active{background:rgba(255,45,117,.15);color:var(--pink)}

/* ===== INPUT ===== */
.input-area{
padding:.8rem 1.2rem 1.5rem;
background:linear-gradient(to top,rgba(10,10,10,.95),transparent);
position:sticky;bottom:0;
}
.input-row{
display:flex;gap:.6rem;align-items:center;
}
.chat-input{
flex:1;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:25px;
padding:.75rem 1.2rem;
color:#fff;font-size:.9rem;
font-family:inherit;outline:none;
transition:border-color .3s;
}
.chat-input:focus{border-color:var(--pink)}
.chat-input::placeholder{color:rgba(255,255,255,.2)}
.send-btn{
width:46px;height:46px;
border-radius:50%;border:none;
background:linear-gradient(135deg,var(--pink),var(--purple));
color:#fff;font-size:1.2rem;
cursor:pointer;
display:flex;align-items:center;justify-content:center;
transition:transform .2s,box-shadow .3s;
box-shadow:0 4px 20px var(--glow);
}
.send-btn:active{transform:scale(.9)}
.emoji-btn{
background:none;border:none;
font-size:1.3rem;cursor:pointer;
padding:0 4px;
transition:transform .2s;
}
.emoji-btn:active{transform:scale(1.2)}

/* ===== EMOJI PICKER ===== */
.emoji-panel{
display:none;
padding:.5rem 1rem;
background:rgba(20,20,40,.95);
border-top:1px solid rgba(255,255,255,.05);
flex-wrap:wrap;gap:.3rem;
max-height:120px;overflow-y:auto;
}
.emoji-panel.open{display:flex}
.emoji-panel span{
font-size:1.4rem;cursor:pointer;
padding:4px;border-radius:8px;
transition:background .2s;
}
.emoji-panel span:active{background:rgba(255,45,117,.2)}

/* ===== ANIMATIONS ===== */
.sparkle{
position:fixed;pointer-events:none;z-index:999;
animation:sparkleFade .8s ease forwards;
font-size:1.2rem;

@keyframes sparkleFade{
0%{opacity:1;transform:translateY(0) scale(1)}

/* ===== FOOTER ===== */
footer{
text-align:center;
padding:1.5rem;

/* ===== RESPONSIVE ===== */
@media(max-width:400px){

</head>

}
